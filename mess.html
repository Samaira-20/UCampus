<!doctype html>
<html>

<head>
  <title>uCampus++ Mess Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="mess.css" />
</head>

<body>

  <div class="navbar">
    <a href="home.html" class="back-btn">←</a>
    <span class="nav-title">Mess Menu 🍽️</span>
    <div class="right-group">
      <a href="home.html" class="home-btn">Home</a>
      <span class="toggle" onclick="toggleMode()" id="modeIcon">☀️</span>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h2>Mess Menu</h2>
      <p>Select your hostel and day to view the full meal schedule.</p>
    </div>

    <div class="hostel-select">
      <label class="hostel-pill" id="girlsPill" onclick="selectHostel('girls')">
        <input type="radio" name="hostel" />
        <span class="pill-dot"></span>
        👩 Girls Hostel
      </label>
      <label class="hostel-pill" id="boysPill" onclick="selectHostel('boys')">
        <input type="radio" name="hostel" />
        <span class="pill-dot"></span>
        👦 Boys Hostel
      </label>
    </div>

    <div class="days">
      <button onclick="showMenu('monday', this)">Mon</button>
      <button onclick="showMenu('tuesday', this)">Tue</button>
      <button onclick="showMenu('wednesday', this)">Wed</button>
      <button onclick="showMenu('thursday', this)">Thu</button>
      <button onclick="showMenu('friday', this)">Fri</button>
      <button onclick="showMenu('saturday', this)">Sat</button>
      <button onclick="showMenu('sunday', this)">Sun</button>
    </div>

    <div id="menuBox">
      <div class="menu-placeholder">
        <div class="emoji">🍽️</div>
        <p>Select your hostel and a day to see the menu</p>
      </div>
    </div>
  </div>
  <script src = "mess.js"></script>
  <script src = "theme.js"></script>
</body>

</html>
